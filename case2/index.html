<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ER미스터리 '한국기금관리공사 성과급 차별 사건'</title>
<style>
/* ============================================================
   DESIGN TOKENS — 빈티지·레트로 사건기록철(색바랜 서류/도장) 단일 테마
   다크 심문실 콘셉트에서 "오래된 종이 서류함" 콘셉트로 재도색.
   폰트는 프리텐다드(가변 폰트, 별도 파일로 게시)만 사용.
   ============================================================ */
@font-face{
  font-family:'Pretendard';
  src:url("../pretendard.woff2") format('woff2');
  font-weight:45 920;
  font-style:normal;
  font-display:swap;
}
:root{
  --ink:#f1e7cd;          /* 페이지 배경(바랜 종이) */
  --ink-2:#e4d3a3;         /* 카드·패널 표면(더 짙은 종이) */
  --ink-3:#b3945a;         /* 테두리·구분선(갈색 잉크) */
  --ink-4:#cfb87e;         /* 호버 표면 */
  --paper:#f8f1dc;         /* 증거서류 종이(약간 더 밝음) */
  --paper-shadow:#d6bf8d;  /* 종이 그림자·테두리 */
  --seal:#a1402a;          /* 고무도장 붉은색(강조) */
  --seal-bright:#bf5539;   /* 도장 강조 hover */
  --gold:#8a6a2b;          /* 놋쇠 라벨 색 */
  --text:#2b2314;          /* 기본 본문(짙은 잉크) */
  --text-dim:#79693f;      /* 보조텍스트(바랜 잉크) */
  --text-paper:#2b2314;    /* 서류 위 본문 */
  --text-paper-dim:#6c5b38; /* 서류 위 보조텍스트 */
  --mono:var(--sans);
  --serif:var(--sans);
  --sans:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--ink);color:var(--text);
  font-family:var(--sans);
  padding-inline:16px;
  word-break:keep-all; /* 한글 어절이 중간에서 끊기지 않도록 */
  background-image:radial-gradient(rgba(43,35,19,.07) 1px, transparent 1.2px);
  background-size:6px 6px;
}
h1,h2,h3{font-family:var(--serif);font-weight:800;text-wrap:balance;margin:0;}
p{line-height:1.65;margin:0;}
button{font-family:var(--sans);cursor:pointer;}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.wrap{max-width:920px;margin:0 auto;padding-block:20px 60px;}
.mono{font-family:var(--mono);}
.hidden{display:none!important;}

/* ---------- 상단 사건 상태바 ---------- */
.casebar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,var(--ink) 70%, transparent);
  padding-block:14px 10px;margin-bottom:8px;
}
.casebar-inner{
  background:var(--ink-2);border:2px solid var(--ink-3);border-radius:5px;
  padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;
}
.case-no{font-family:var(--mono);font-size:12px;color:var(--seal);letter-spacing:.05em;font-weight:700;text-transform:uppercase;}
.case-title{font-family:var(--serif);font-weight:900;font-size:17px;}
.phase-track{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}
.phase-dot{
  font-size:11px;font-family:var(--mono);padding:3px 9px;border-radius:99px;
  border:1px solid var(--ink-4);color:var(--text-dim);white-space:nowrap;
}
.phase-dot.active{background:var(--seal);border-color:var(--seal);color:#fff;}
.phase-dot.done{border-color:var(--gold);color:var(--gold);}
.timer{
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;
  color:var(--text);padding:2px 10px;border-left:1px solid var(--ink-3);
}
.btn{
  border:2px solid var(--text);background:var(--paper);color:var(--text);
  border-radius:4px;padding:9px 14px;font-size:13px;font-weight:700;
  text-transform:uppercase;letter-spacing:.03em;
  box-shadow:2px 2px 0 var(--text);
  transition:transform .1s,box-shadow .1s;
}
.btn:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--text);}
.btn.primary{background:var(--seal);border-color:var(--seal);color:var(--paper);box-shadow:2px 2px 0 var(--text);}
.btn.primary:hover{background:var(--seal-bright);}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
.btn.seal{background:var(--seal);border-color:var(--seal);color:var(--paper);}
.btn.seal:hover{background:var(--seal-bright);}
.sync-note{font-size:11px;color:var(--text-dim);width:100%;}

/* ---------- 내 소유 카드 팝업 ---------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(43,35,19,.55);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;
}
.modal-panel{
  background:var(--paper);color:var(--text-paper);border:3px double var(--seal);border-radius:8px;
  max-width:560px;width:100%;padding:22px;box-shadow:6px 6px 0 rgba(43,35,19,.3);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head h3{font-family:var(--serif);font-size:17px;font-weight:800;}
.my-card{border-top:1px dashed var(--paper-shadow);padding-top:14px;margin-top:14px;}
.my-card:first-of-type{border-top:none;margin-top:0;padding-top:0;}
.my-card .doc-title{font-family:var(--serif);font-weight:700;font-size:14px;margin-bottom:4px;}
.my-card .doc-body{font-size:12.5px;line-height:1.6;white-space:pre-wrap;}
.my-card .doc-note{margin-top:8px;padding-top:6px;border-top:1px dashed var(--paper-shadow);font-size:12px;font-style:italic;color:var(--seal);}

/* ---------- 역할 선택 게이트 ---------- */
.gate h1{font-size:clamp(24px,5vw,32px);margin-bottom:6px;}
.gate .lede{color:var(--text-dim);margin-bottom:22px;max-width:60ch;}

/* ---------- 표지(입장) 화면 — 보드게임 박스 커버 느낌 ---------- */
.cover{
  max-width:520px;margin:48px auto 0;text-align:center;
  background:var(--paper);border:4px double var(--seal);border-radius:10px;
  padding:40px 32px 34px;box-shadow:7px 7px 0 var(--paper-shadow);
}
.cover-emblem{width:140px;height:140px;margin:0 auto 14px;}
.cover-eyebrow{
  font-family:var(--mono);font-size:12px;color:var(--seal);letter-spacing:.1em;
  font-weight:700;text-transform:uppercase;margin-bottom:4px;
}
.cover-title{font-size:clamp(22px,5.2vw,30px);font-weight:900;letter-spacing:-.01em;line-height:1.25;}
.cover-tagline{margin-top:8px;color:var(--text-dim);font-size:13.5px;letter-spacing:.03em;}
.cover-divider{width:56px;height:3px;background:var(--gold);margin:20px auto;border-radius:2px;}
.cover-lede{color:var(--text-dim);margin:0 auto 18px;max-width:40ch;font-size:13.5px;}
.cover-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;}
.cover-footnote{margin-top:22px;font-size:11px;color:var(--text-dim);opacity:.85;}
.cover-back{display:inline-block;margin-top:14px;font-size:12.5px;color:var(--gold);text-decoration:none;}
.cover-back:hover{text-decoration:underline;}
@media (max-width:480px){ .cover{padding:32px 20px 28px;} }
.side-block{margin-bottom:22px;}
.side-heading{font-size:14px;font-weight:800;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--ink-3);}
.side-heading.employer{color:var(--ink-3);}
.side-heading.floor{color:var(--gold);}
.role-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.role-card{
  position:relative;overflow:hidden;
  background:var(--ink-2);border:2px solid var(--ink-3);border-radius:5px;
  box-shadow:2px 2px 0 var(--paper-shadow);
  padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;
}
.side-tag{
  align-self:flex-start;font-family:var(--mono);font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em;
}
.side-tag.employer{background:var(--ink-3);color:var(--paper);}
.side-tag.floor{background:var(--gold);color:var(--paper);}
.role-card .seat{font-family:var(--mono);font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;font-weight:700;}
.role-card .name{font-family:var(--serif);font-weight:800;font-size:18px;}
.role-card .org{font-size:12px;color:var(--text-dim);}
.role-card .pick{margin-top:6px;}
.role-card.taken{background:var(--ink);}
.role-card.taken .seat,.role-card.taken .org{opacity:.55;}
.role-card.taken .pick{background:none;border:none;color:var(--text-dim);font-size:12px;padding:0;}
.role-card .stamp-badge{
  position:absolute;top:8px;right:8px;width:50px;height:50px;border-radius:50%;
  border:3px solid var(--seal);color:var(--seal);background:rgba(255,255,255,.4);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--serif);font-weight:800;font-size:10px;line-height:1.15;
  transform:rotate(-16deg);animation:stampIn .35s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes stampIn{
  0%{transform:rotate(-16deg) scale(1.8);opacity:0;}
  60%{transform:rotate(-16deg) scale(.9);opacity:1;}
  100%{transform:rotate(-16deg) scale(1);opacity:1;}
}
@media (prefers-reduced-motion:reduce){
  .role-card .stamp-badge{animation:none;}
}
.role-card.npc{opacity:.7;border-style:dashed;}
.role-card .pick.npc{background:none;border:none;color:var(--text-dim);font-size:12px;padding:0;font-weight:700;}
.role-card .btn.npc-toggle{font-size:11px;padding:5px 8px;background:none;color:var(--text-dim);border-color:var(--ink-3);}
.role-card .btn.npc-cancel{font-size:11px;padding:5px 8px;align-self:flex-start;}
.casting-progress{
  font-family:var(--mono);font-size:13px;color:var(--gold);font-weight:700;
  margin-bottom:18px;padding:8px 12px;background:var(--ink-2);border-radius:4px;display:inline-block;
}

/* ---------- 탭 ---------- */
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap;}
.tab{
  background:var(--paper);border:2px solid var(--ink-3);color:var(--text-dim);
  border-radius:3px;padding:7px 14px;font-size:13px;font-weight:600;
}
.tab.active{background:var(--ink-3);color:var(--paper);border-color:var(--ink-3);}

/* ---------- 내 신원 카드 ---------- */
.id-card{
  background:var(--ink-2);border:2px solid var(--ink-3);border-radius:6px;
  box-shadow:3px 3px 0 var(--paper-shadow);
  padding:20px;display:grid;gap:14px;
}
.id-head{display:flex;gap:14px;align-items:center;}
.id-badge{
  width:52px;height:52px;border-radius:4px;background:var(--seal);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:22px;color:var(--paper);flex-shrink:0;
}
.id-name{font-family:var(--serif);font-weight:900;font-size:20px;}
.id-org{font-size:13px;color:var(--text-dim);}
.id-field{border-top:1px dashed var(--ink-3);padding-top:12px;}
.id-field .label{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:4px;text-transform:uppercase;}
.id-field .val{font-size:14px;line-height:1.6;}
.id-field.secret .val{color:var(--seal);font-weight:600;}
.id-field.secret .val{
  filter:blur(7px);transition:filter .12s ease;cursor:pointer;user-select:none;outline:none;
}
.id-field.secret .val:active, .id-field.secret .val:focus{filter:none;}
.id-field.secret .hint{margin-top:5px;font-size:11px;color:var(--text-dim);font-style:italic;}
@media (prefers-reduced-motion:reduce){
  .id-field.secret .val{transition:none;}
}
.goal-list{display:grid;gap:10px;}
.goal-line{font-size:14px;line-height:1.6;}
.goal-tag{display:block;font-family:var(--mono);font-size:10.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}

/* ---------- 사건 개요(핵심 법리 가이드 + 초심 판정 요지 + 타임라인) ---------- */
.legal-guide{
  background:var(--ink-2);border:2px solid var(--seal);border-radius:6px;
  padding:14px 18px;margin-bottom:20px;
}
.legal-guide-title{font-family:var(--serif);font-weight:800;font-size:14px;color:var(--seal);margin-bottom:8px;}
.legal-point{font-size:13px;color:var(--text-dim);line-height:1.6;margin-top:10px;}
.legal-point:first-of-type{margin-top:0;}
.legal-point b{display:block;color:var(--text);font-size:13.5px;margin-bottom:3px;}
.legal-detail{margin-top:6px;}
.legal-detail summary{
  cursor:pointer;list-style:none;font-size:12px;color:var(--gold);font-weight:700;
  display:flex;align-items:center;gap:5px;
}
.legal-detail summary::-webkit-details-marker{display:none;}
.legal-detail summary::before{content:"▸";transition:transform .15s ease;}
.legal-detail[open] summary::before{transform:rotate(90deg);}
.legal-detail-body{margin-top:6px;padding:8px 10px;background:var(--paper);border-left:2px solid var(--gold);font-size:12.5px;color:var(--text-dim);line-height:1.6;}
@media (prefers-reduced-motion:reduce){.legal-detail summary::before{transition:none;}}
.ruling-box{
  background:var(--paper);color:var(--text-paper);border-radius:6px;padding:18px 20px;
  border:3px double var(--ink-3);margin-bottom:20px;
}
.ruling-title{font-family:var(--serif);font-weight:800;font-size:14px;margin-top:4px;}
.ruling-subtitle{font-size:11.5px;color:var(--text-paper-dim);margin:2px 0 10px;}
.ruling-headline{font-family:var(--serif);font-weight:800;font-size:16px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px dashed var(--paper-shadow);}
.ruling-box p{font-size:13px;line-height:1.6;}
.ruling-box h4{font-family:var(--serif);font-weight:800;font-size:13px;letter-spacing:.04em;margin:4px 0 8px;}
.ruling-order{margin:0 0 14px;padding-left:20px;display:grid;gap:8px;}
.ruling-order li{font-size:13px;line-height:1.6;}
.ruling-reasons{margin-top:16px;padding-top:14px;border-top:1px dashed var(--paper-shadow);}
.ruling-section{margin-bottom:16px;}
.ruling-section .ruling-section{margin-left:14px;margin-top:10px;margin-bottom:10px;}
.ruling-section p{margin-bottom:8px;}
.timeline{display:grid;gap:0;border-left:2px solid var(--ink-3);margin-left:6px;}
.tl-item{position:relative;padding:0 0 18px 20px;}
.tl-item::before{
  content:'';position:absolute;left:-6.5px;top:3px;width:11px;height:11px;
  border-radius:50%;background:var(--gold);border:2px solid var(--ink);
}
.tl-date{font-family:var(--mono);font-size:12px;color:var(--gold);}
.tl-text{font-size:14px;margin-top:3px;}
.tl-text b{color:var(--text);}

/* ---------- 증거카드(플립) ---------- */
.board-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);margin-bottom:14px;}
.board-legend b{color:var(--text);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;}
.owner-tag{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
.ownable{
  background:var(--ink-2);border:2px solid var(--seal);border-radius:5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:16px;aspect-ratio:5/6;min-height:180px;text-align:center;
}
.ownable .claim-btn{margin-top:4px;}
.face.front .reveal-btn{margin-top:6px;font-size:11px;padding:5px 8px;}
.locked.claimed{border-style:solid;}
.flipcard{
  perspective:1400px;aspect-ratio:5/6;min-height:180px;
}
.flipcard-inner{
  position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.flipcard.flipped .flipcard-inner{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:5px;
  padding:16px;display:flex;flex-direction:column;
}
.face.front{
  background:
    repeating-linear-gradient(135deg, rgba(43,35,19,.06) 0 2px, transparent 2px 14px),
    var(--ink-2);
  border:2px dashed var(--ink-3);align-items:center;justify-content:center;
  text-align:center;gap:10px;cursor:pointer;
}
.face.front .seal-icon{
  width:44px;height:44px;border-radius:50%;border:2px solid var(--seal);color:var(--seal);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.face.front .exhibit-no{font-family:var(--mono);font-size:12px;color:var(--gold);text-transform:uppercase;font-weight:700;}
.face.front .tap-hint{font-size:11px;color:var(--text-dim);}
.face.back{
  background:var(--paper);color:var(--text-paper);transform:rotateY(180deg);
  border:2px solid var(--paper-shadow);box-shadow:3px 3px 0 var(--paper-shadow);cursor:pointer;overflow-y:auto;
}
.face.back .doc-head{
  display:flex;justify-content:space-between;font-family:var(--mono);
  font-size:10px;color:var(--text-paper-dim);border-bottom:1px solid var(--paper-shadow);
  padding-bottom:6px;margin-bottom:8px;
}
.face.back .doc-title{font-family:var(--serif);font-weight:700;font-size:14px;margin-bottom:8px;}
.face.back .doc-body{font-size:12.5px;line-height:1.6;white-space:pre-wrap;}
.face.back .doc-note{
  margin-top:10px;padding-top:8px;border-top:1px dashed var(--paper-shadow);
  font-size:12px;font-style:italic;color:var(--seal);
}
.locked{
  background:var(--ink-2);border:2px dashed var(--ink-3);border-radius:5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--text-dim);font-size:12px;aspect-ratio:5/6;min-height:180px;
}
.locked .lock-icon{font-size:22px;}

/* ---------- 최근 공개된 증거 피드 ---------- */
.reveal-feed{
  background:var(--paper);border:2px solid var(--seal);border-radius:6px;
  padding:10px 14px;margin-bottom:16px;box-shadow:2px 2px 0 var(--paper-shadow);
}
.reveal-feed-label{font-family:var(--serif);font-weight:800;font-size:12.5px;color:var(--seal);margin-bottom:6px;}
.reveal-feed-list{display:flex;flex-direction:column;gap:4px;}
.reveal-chip{font-size:12.5px;color:var(--text-paper);}
.reveal-chip .exhibit-no{font-family:var(--mono);color:var(--gold);font-weight:700;margin-right:4px;}
.reveal-chip .reveal-by{color:var(--text-paper-dim);}

/* ---------- 공개 알림 토스트 ---------- */
.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);z-index:60;
  background:var(--text);color:var(--paper);padding:10px 18px;border-radius:6px;
  font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.28);opacity:0;
  transition:opacity .25s,transform .25s;max-width:min(90vw,420px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- 토론/투표 ---------- */
.matrix{display:grid;gap:12px;}
.matrix-card{background:var(--ink-2);border:2px solid var(--ink-3);border-radius:6px;padding:14px 16px;}
.matrix-card .topic{font-family:var(--serif);font-weight:800;font-size:14px;margin-bottom:8px;}
.matrix-row{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:12.5px;line-height:1.55;padding:4px 0;}
.matrix-row .tag{
  font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 6px;
  border-radius:3px;height:fit-content;white-space:nowrap;text-align:center;
}
.matrix-row.legal .tag{background:var(--text);color:var(--paper);}
.matrix-row.legal{border-bottom:1px dashed var(--paper-shadow);margin-bottom:4px;padding-bottom:8px;}
.matrix-row.employer .tag{background:var(--ink-3);color:var(--paper);}
.matrix-row.union .tag{background:var(--gold);color:var(--paper);}
.matrix-row.truth .tag{background:var(--seal);color:var(--paper);}
.matrix-row.truth{border-top:1px dashed var(--paper-shadow);margin-top:4px;padding-top:8px;font-style:italic;}
.vote-axis{margin-top:20px;}
.vote-axis:first-of-type{margin-top:8px;}
.axis-h{font-family:var(--serif);font-weight:700;font-size:15px;margin-bottom:6px;}
.axis-label{font-family:var(--mono);color:var(--gold);font-size:12px;margin-right:6px;}
.vote-grid{display:grid;gap:12px;margin-top:14px;}
.vote-opt{
  text-align:left;background:var(--ink-2);border:2px solid var(--ink-3);border-radius:6px;
  box-shadow:2px 2px 0 var(--paper-shadow);
  padding:16px;color:var(--text);
}
.vote-opt:hover{border-color:var(--gold);}
.vote-opt.selected{border-color:var(--seal);background:var(--ink-4);}
.vote-opt .n{font-family:var(--mono);color:var(--gold);font-size:12px;}
.vote-opt .t{font-family:var(--serif);font-weight:700;font-size:15px;margin:4px 0;}
.vote-opt .d{font-size:12.5px;color:var(--text-dim);}
.vote-progress{margin-top:16px;font-size:13px;color:var(--text-dim);}

/* ---------- 결과 ---------- */
.tally{display:grid;gap:10px;margin:16px 0 24px;}
.tally-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;}
.tally-bar-track{grid-column:1/3;height:10px;border-radius:99px;background:var(--ink-3);overflow:hidden;}
.tally-bar-fill{height:100%;background:var(--gold);}
.tally-row.match .tally-bar-fill{background:var(--seal);}
.verdict-box{
  background:var(--paper);color:var(--text-paper);border-radius:6px;padding:22px;
  border:4px double var(--seal);
}
.verdict-box h2{font-size:20px;margin-bottom:10px;}
.verdict-box .stamp{
  display:inline-block;border:2px solid var(--seal);color:var(--seal);
  font-family:var(--serif);font-weight:900;padding:3px 10px;border-radius:4px;
  font-size:13px;margin-bottom:10px;transform:rotate(-2deg);text-transform:uppercase;letter-spacing:.03em;
}
.lesson{
  margin-top:16px;background:var(--ink-2);border-left:4px solid var(--gold);border-radius:3px;
  padding:16px;font-size:13.5px;line-height:1.65;
}
.lesson .label{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:6px;}
.epilogue-box{
  margin-top:16px;background:var(--ink-2);border-left:4px solid var(--gold);border-radius:3px;
  padding:16px;font-size:13.5px;line-height:1.65;
}
.epilogue-box .label{font-family:var(--mono);font-size:11px;color:var(--gold);margin-bottom:10px;}
.epilogue-row{margin-top:12px;}
.epilogue-row:first-of-type{margin-top:0;}
.epilogue-row .ep-name{font-family:var(--serif);font-weight:700;}
.epilogue-row .ep-tag{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;margin-left:6px;}
.epilogue-row .ep-score{font-family:var(--mono);font-weight:700;margin-left:8px;}
.epilogue-row .ep-score.pos{color:var(--gold);}
.epilogue-row .ep-score.neg{color:var(--seal);}

@media (prefers-reduced-motion:reduce){
  .flipcard-inner{transition:none;}
}
.conn-banner{
  display:none; position:sticky; top:0; z-index:50;
  padding:8px 16px; text-align:center; font-size:12.5px; font-weight:700;
  font-family:var(--mono); letter-spacing:.02em;
}
.conn-banner.show{display:block;}
.conn-banner.local{background:var(--seal); color:#fff;}
.conn-banner.slow{background:var(--gold); color:#fff;}

/* ============================================================
   2. 저장소 어댑터 — db 캡차빌리티(있으면 실시간 동기화) / 없으면 로컬 단일기기 모드
   ============================================================ */
function makeLocalStore(){
  let state = {phase:"casting", phaseEndsAt: Date.now()+DURATIONS.casting*1000};
  const players = new Map(); const votes = new Map(); const claims = new Map(); const tokenUse = new Map(); const ready = new Set(); const revealed = new Map(); const npc = new Set();
  const stateCbs=[], playerCbs=[], voteCbs=[], claimCbs=[], tokenCbs=[], readyCbs=[], revealCbs=[], npcCbs=[];
  return {
    isLocal:true,
    onState(cb){stateCbs.push(cb); cb(state); return ()=>{};},
    setPhase(phase){state={phase, phaseEndsAt: Date.now()+(DURATIONS[phase]||0)*1000}; stateCbs.forEach(cb=>cb(state));},
    getState(){return state;},
    onPlayers(cb){playerCbs.push(cb); cb(players); return ()=>{};},
    claimRole(roleId,name,playerName){ if(!players.has(roleId)){ players.set(roleId,{name,playerName:playerName||""}); playerCbs.forEach(cb=>cb(players)); return true;} return players.get(roleId).name===name;},
    releaseRole(roleId){ players.delete(roleId); playerCbs.forEach(cb=>cb(players)); },
    onVotes(cb){voteCbs.push(cb); cb(votes); return ()=>{};},
    castVote(roleId,vote){votes.set(roleId,vote); voteCbs.forEach(cb=>cb(votes));},
    onClaims(cb){claimCbs.push(cb); cb(claims); return ()=>{};},
    claimCard(cardId,roleId,phase){
      if(claims.has(cardId)) return false;
      const key = phase+"_"+roleId; const used = tokenUse.get(key)?.count||0;
      if(used >= TOKENS_PER_ROUND) return false;
      claims.set(cardId,{by:roleId}); claimCbs.forEach(cb=>cb(claims));
      tokenUse.set(key,{count:used+1}); tokenCbs.forEach(cb=>cb(tokenUse));
      return true;
    },
    onTokenUse(cb){tokenCbs.push(cb); cb(tokenUse); return ()=>{};},
    spendToken(phase,roleId){
      const key = phase+"_"+roleId; const used = tokenUse.get(key)?.count||0;
      if(used >= TOKENS_PER_ROUND) return false;
      tokenUse.set(key,{count:used+1}); tokenCbs.forEach(cb=>cb(tokenUse));
      return true;
    },
    onReady(cb){readyCbs.push(cb); cb(ready); return ()=>{};},
    setReady(key,isReady){ if(isReady) ready.add(key); else ready.delete(key); readyCbs.forEach(cb=>cb(ready)); },
    onRevealed(cb){revealCbs.push(cb); cb(revealed); return ()=>{};},
    revealCard(cardId, roleId){ revealed.set(cardId,{by:roleId, at:new Date().toISOString()}); revealCbs.forEach(cb=>cb(revealed)); },
    onNpc(cb){npcCbs.push(cb); cb(npc); return ()=>{};},
    setNpc(roleId,isNpc){ if(isNpc) npc.add(roleId); else npc.delete(roleId); npcCbs.forEach(cb=>cb(npc)); },
  };
}
function makeDbStore(db, roomId){
  // 조(room)별로 경로를 분리 — 같은 코드를 쓴 조끼리만 진행상황을 공유
  const stateRef = db.doc(`rooms/${roomId}`);
  const playersCol = db.collection(`rooms/${roomId}/players`);
  const votesCol = db.collection(`rooms/${roomId}/votes`);
  const claimsCol = db.collection(`rooms/${roomId}/claims`);
  const readyCol = db.collection(`rooms/${roomId}/ready`);
  const revealedCol = db.collection(`rooms/${roomId}/revealed`);
  const npcCol = db.collection(`rooms/${roomId}/npc`);
  const tokenCol = db.collection(`rooms/${roomId}/tokenUse`);
  return {
    isLocal:false,
    onState(cb){
      return stateRef.onSnapshot(async (snap)=>{
        if(!snap.exists){
          try{ await stateRef.set({phase:"casting", phaseEndsAt:new Date(Date.now()+DURATIONS.casting*1000).toISOString()}); }catch(e){}
          return;
        }
        cb(snap.data());
      }, ()=>{});
    },
    async setPhase(phase){
      try{ await stateRef.set({phase, phaseEndsAt:new Date(Date.now()+(DURATIONS[phase]||0)*1000).toISOString()}); }catch(e){}
    },
    onPlayers(cb){
      return playersCol.onSnapshot(qs=>{
        const m=new Map(); qs.docs.forEach(d=>m.set(d.id,d.data())); cb(m);
      }, ()=>{});
    },
    async claimRole(roleId,name,playerName){
      // get-then-set이 아니라 트랜잭션으로 — 두 사람이 같은 역할을 동시에 누르면 get-then-set은
      // 둘 다 "비어있음"을 보고 둘 다 성공해버리는 경합이 생길 수 있어(그 결과 myRole이 같은 값으로
      // 겹치는 게 이후 카드 공개 권한 오작동의 원인이 될 수 있음), 트랜잭션으로 원자적으로 처리한다.
      const ref = playersCol.doc(roleId);
      try{
        return await db.runTransaction(async tx=>{
          const snap = await tx.get(ref);
          if(snap.exists) return snap.data().name===name;
          tx.set(ref, {name, playerName:playerName||"", at:new Date().toISOString()});
          return true;
        });
      }catch(e){ return false; }
    },
    async releaseRole(roleId){ try{ await playersCol.doc(roleId).delete(); }catch(e){} },
    onVotes(cb){
      return votesCol.onSnapshot(qs=>{
        const m=new Map(); qs.docs.forEach(d=>m.set(d.id,d.data())); cb(m);
      }, ()=>{});
    },
    async castVote(roleId,vote){ try{ await votesCol.doc(roleId).set({...vote, at:new Date().toISOString()}); }catch(e){} },
    onClaims(cb){
      return claimsCol.onSnapshot(qs=>{
        const m=new Map(); qs.docs.forEach(d=>m.set(d.id,d.data())); cb(m);
      }, ()=>{});
    },
    async claimCard(cardId, roleId, phase){
      // 마찬가지로 트랜잭션 — get-then-set 경합이 있으면 동시 클릭 시 두 명이 모두
      // "가져가기 성공"으로 응답받아 카드가 자신 것이라 착각하는 문제가 생긴다.
      // 확보도 토큰을 쓰는 행동이라, 같은 트랜잭션 안에서 토큰 잔여량도 함께 체크·차감한다.
      const ref = claimsCol.doc(cardId);
      const tokenRef = tokenCol.doc(tokenKey(phase, roleId));
      try{
        return await db.runTransaction(async tx=>{
          const snap = await tx.get(ref);
          if(snap.exists) return false; // 이미 다른 사람이 가져감
          const tokenSnap = await tx.get(tokenRef);
          const used = tokenSnap.exists ? (tokenSnap.data().count||0) : 0;
          if(used >= TOKENS_PER_ROUND) return false; // 이번 라운드 토큰 소진
          tx.set(ref, {by:roleId, at:new Date().toISOString()});
          tx.set(tokenRef, {count: used+1}, {merge:true});
          return true;
        });
      }catch(e){ return false; }
    },
    onTokenUse(cb){
      return tokenCol.onSnapshot(qs=>{
        const m=new Map(); qs.docs.forEach(d=>m.set(d.id, d.data())); cb(m);
      }, ()=>{});
    },
    async spendToken(phase, roleId){
      // view형/타인 공개 카드를 열람할 때 쓰는 순수 토큰 소모(소유권 없음) — claimCard와 동일한 트랜잭션 패턴
      const tokenRef = tokenCol.doc(tokenKey(phase, roleId));
      try{
        return await db.runTransaction(async tx=>{
          const snap = await tx.get(tokenRef);
          const used = snap.exists ? (snap.data().count||0) : 0;
          if(used >= TOKENS_PER_ROUND) return false;
          tx.set(tokenRef, {count: used+1}, {merge:true});
          return true;
        });
      }catch(e){ return false; }
    },
    onReady(cb){
      return readyCol.onSnapshot(qs=>{
        const s=new Set(); qs.docs.forEach(d=>s.add(d.id)); cb(s);
      }, ()=>{});
    },
    async setReady(key, isReady){
      try{
        if(isReady) await readyCol.doc(key).set({at:new Date().toISOString()});
        else await readyCol.doc(key).delete();
      }catch(e){}
    },
    onRevealed(cb){
      return revealedCol.onSnapshot(qs=>{
        const m=new Map(); qs.docs.forEach(d=>m.set(d.id, d.data())); cb(m);
      }, ()=>{});
    },
    async revealCard(cardId, roleId){ try{ await revealedCol.doc(cardId).set({by:roleId, at:new Date().toISOString()}); }catch(e){} },
    onNpc(cb){
      return npcCol.onSnapshot(qs=>{
        const s=new Set(); qs.docs.forEach(d=>s.add(d.id)); cb(s);
      }, ()=>{});
    },
    async setNpc(roleId, isNpc){
      try{
        if(isNpc) await npcCol.doc(roleId).set({at:new Date().toISOString()});
        else await npcCol.doc(roleId).delete();
      }catch(e){}
    },
  };
}

// 조(room) 연결 — 코드 입력 시 그 조 전용 경로로 스토어를 새로 구성

  players = new Map(); votes = new Map(); claims = new Map(); tokenUse = new Map(); readySet = new Set(); revealedSet = new Map(); revealNotifyReady = false; npcSet = new Set(); myCardsOpen = false; rosterOpen = false;
  phaseGuideOpen = false; lastSeenGuidePhase = null; paidOpenSet = new Set(); lastTokenSig = "";

  store = dbHandle ? makeDbStore(dbHandle, myRoom) : makeLocalStore();

  // 사용자 클릭(예: 카드 가져가기)이 화면 재구성 때문에 씹힐 수 있다.
  unsubFns.push(store.onState(s=>{

    if(changed) paidOpenSet = new Set(); // 새 단계로 넘어가면 토큰도 리셋되므로, 펼쳐둔 유료 카드 표시도 같이 접어둠
    sharedState = s;
    const wasLoaded = stateLoaded;
    stateLoaded = true;
    if(!wasLoaded) updateConnBanner();
    if(changed) render(); // render() 안에서 새 단계 안내 팝업 표시 여부를 알아서 체크함
  }));
  unsubFns.push(store.onPlayers(p=>{
    const changed = p.size!==players.size;
    players = p;
    if(changed && (!myRole || sharedState.phase==="casting")) render();
  }));
  unsubFns.push(store.onNpc(n=>{
    const changed = n.size!==npcSet.size;
    npcSet = n;
    if(changed && (!myRole || sharedState.phase==="casting")) render();
  }));
  unsubFns.push(store.onVotes(v=>{ const changed = v.size!==votes.size; votes = v; if(changed && (sharedState.phase==="vote"||sharedState.phase==="result")) render(); }));

    const changed = c.size!==claims.size; claims = c;
    if(changed && activeTab==="cards") render();
  }));
  unsubFns.push(store.onTokenUse(t=>{
    // claims/votes는 새 문서가 추가되는 구조라 size 비교로 변경을 감지했지만, tokenUse는
    // 같은 `${phase}_${roleId}` 문서의 count 필드만 증가하므로 size가 그대로라 그 방식이 안 통함 —

    const sig = JSON.stringify([...t.entries()].sort());
    const changed = sig !== lastTokenSig; lastTokenSig = sig;
    tokenUse = t;
    // 전원이 이번 라운드 토큰을 다 쓰면 더 볼 게 없다는 뜻 — 시간이 남아도 바로 토론으로
    if(changed && stateLoaded && players.size>0 && EVIDENCE_PHASES.includes(sharedState.phase) && allPlayersUsedAllTokens()) store.setPhase("discussion");
    if(changed) render(); // 토큰 배지가 상단 케이스바에도 상시 표시되므로 탭 제한 없이 다시 그린다
  }));
  unsubFns.push(store.onRevealed(r=>{
    const changed = r.size!==revealedSet.size;
    // 방 접속 직후 첫 스냅샷은 기존에 이미 공개돼있던 카드 목록일 뿐이라 조용히 반영하고,
    // 그 이후 새로 추가된 카드만 "누가 공개했다"는 푸시 토스트로 전원에게 알린다.
    if(revealNotifyReady){
      r.forEach((info,id)=>{
        if(revealedSet.has(id)) return;
        const card = ALL_CARDS.find(c=>c.id===id);
        const revealer = CHARACTERS.find(c=>c.id===info.by);
        if(card) showToast(`🗣 ${revealer?revealer.name:"누군가"}님이 증거 ${card.exhibit}를 공개했습니다`);
      });
    }
    revealNotifyReady = true;
    revealedSet = r;
    // 상단 "최근 공개된 증거" 피드가 이제 모든 탭에서 보이므로, 탭 제한 없이 다시 그린다.
    if(changed) render();
  }));
  unsubFns.push(store.onReady(r=>{
    const changed = r.size!==readySet.size;
    readySet = r;
    // 참가한 전원(이미 역할을 고른 사람 수 기준)이 준비완료를 누르면 시간이 남아도 바로 다음 단계로
    if(stateLoaded && players.size>0 && sharedState.phase!=="result" && readyCountForPhase()>=players.size){ advancePhase(); }
    if(changed) render();
  }));
  render();
}

function showToast(text){

function fmtClock(ms){
  const s = Math.max(0, Math.round(ms/1000));
  const m = Math.floor(s/60), r = s%60;
  return String(m).padStart(2,"0")+":"+String(r).padStart(2,"0");
}

  // 눌러도 결과로 안 넘어가게 막는다 — 안 그러면 0표/일부표인 채로 결과 화면에 진짜 판정처럼
  // "재심 인용" 등이 떠버리는 문제가 있었다(과반 계산이 동수를 기각으로 처리하는데, 0표도 동수라
  // 그대로 기각 결과가 나와버림, 2026-09-15).
  if(sharedState.phase==="vote" && players.size>0 && votesDoneCount()<players.size) return;
  const idx = phaseIndex(sharedState.phase);
  const next = PHASES[Math.min(idx+1, PHASES.length-1)];
  if(next !== sharedState.phase) store.setPhase(next);
}

        bodyHtml = `<div class="stamp-badge">배정<br>완료</div><div class="pick">${isMe?"✔ 나":`✔ ${players.get(c.id)?.playerName || "선택됨"}`}</div>`;

        bodyHtml = `<div class="pick npc">🤖 NPC로 진행</div><button class="btn npc-cancel" data-npcoff="${c.id}">되돌리기</button>`;
      } else {
        bodyHtml = `

function renderGate(){
  const filled = players.size + npcSet.size;
  const ready = castingFilled();
  const waiting = myRole && sharedState.phase==="casting"; // 나는 이미 배역을 정했고, 다른 사람들을 기다리는 중
  app.innerHTML = `
    <div class="gate">
      <div class="case-no mono">사건번호 ${CASE_NO} · 방 코드 ${myRoom}</div>
      <h1>ER 미스터리 '한국기금관리공사 성과급 차별 사건'</h1>
      ${renderGuideBox(CORE_CONCEPTS)}
      ${renderGuideBox(LEARNING_POINTS)}
      ${waiting
        ? `<p class="lede">당신은 <b>${CHARACTERS.find(c=>c.id===myRole).name}</b> 역할입니다. ${ready?"모든 배역이 정해졌습니다 — 준비됐으면 아래 버튼으로 사건을 시작하세요.":"다른 참가자들이 배역을 고르는 중이에요."}</p>`
        : `<p class="lede">사측 경영진 3명 · 근로자측 3명, 총 6개의 역할이 각자 다른 증거를 쥐고 있습니다. 자신의 배역을 선택하세요 — 이미 다른 참가자가 고른 배역은 선택할 수 없습니다. 6명이 다 모이지 않았다면, 남는 역할을 "NPC로" 돌려서 인원 수를 맞출 수 있습니다.</p>`
      }
      <div class="casting-progress">배역 확정 현황: <b>${filled} / ${CHARACTERS.length}</b>${npcSet.size?` (참가자 ${players.size}명 · NPC ${npcSet.size}명)`:""}</div>
      ${ready?`<button class="btn primary" id="startGameBtn" style="margin-bottom:16px;">🎬 사건 시작하기</button>`:""}
      ${gateError?`<p style="color:var(--seal-bright);font-size:13px;margin-bottom:14px;">${gateError}</p>`:""}
      <button class="btn" id="leaveRoomBtn" style="margin-bottom:16px;">다른 조 코드로 나가기</button>
      ${waiting?`<button class="btn" id="switchRoleBtn" style="margin-bottom:16px;margin-left:8px;">↺ 다른 배역으로 바꾸기</button>`:""}
      <div class="side-block">
        <h3 class="side-heading employer">사측 진영</h3>
        ${renderRoleGrid(CHARACTERS.filter(c=>c.side==='사측'))}
      </div>
      <div class="side-block">
        <h3 class="side-heading floor">근로자측 진영</h3>
        ${renderRoleGrid(CHARACTERS.filter(c=>c.side!=='사측'))}
      </div>
    </div>
  `;
  document.getElementById("leaveRoomBtn").addEventListener("click", leaveRoom);
  app.querySelectorAll("[data-role]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const roleId = b.dataset.role;
      const name = CHARACTERS.find(c=>c.id===roleId).name;
      b.disabled = true; b.textContent = "확인 중...";
      try{
        const ok = await store.claimRole(roleId, name, myName);
        if(ok){ myRole = roleId; localStorage.setItem("lm_role_"+myRoom, roleId); loadMyOpened(); render(); }
        else { gateError = "이미 다른 참가자가 선택한 역할입니다."; render(); }
      }catch(e){
        gateError = "역할 선택 중 통신 오류가 발생했습니다. 다시 시도해 주세요.";
        render();
      }
    });
  });
  app.querySelectorAll("[data-npcon]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      b.disabled = true;
      try{ await store.setNpc(b.dataset.npcon, true); }catch(e){}
      render();
    });
  });
  app.querySelectorAll("[data-npcoff]").forEach(b=>{
    b.addEventListener("click", async ()=>{
      b.disabled = true;
      try{ await store.setNpc(b.dataset.npcoff, false); }catch(e){}
      render();
    });
  });
  const startBtn = document.getElementById("startGameBtn");
  if(startBtn) startBtn.addEventListener("click", ()=>{
    startBtn.disabled = true; startBtn.textContent = "시작하는 중...";
    advancePhase();
  });
  const switchBtn = document.getElementById("switchRoleBtn");
  if(switchBtn) switchBtn.addEventListener("click", async ()=>{
    switchBtn.disabled = true;
    const prevRole = myRole;
    myRole = null;
    localStorage.removeItem("lm_role_"+myRoom);
    players.delete(prevRole); // 서버 응답을 기다리지 않고 화면부터 바로 갱신
    render();
    try{ await store.releaseRole(prevRole); }catch(e){}
  });
}

function renderBoard(){
  const cards = ALL_CARDS; // 공용 증거대 — 전원 동일한 풀을 봄
  if(!isCardUnlocked()){
    return `
      <div class="board-legend"><span>증거대는 1라운드가 시작되면 열립니다.</span></div>
      <div class="card-grid">${cards.map(card=>`<div class="locked"><div class="lock-icon">🔒</div><div>아직 열리지 않았습니다</div><div class="owner-tag">${card.ownerName}</div></div>`).join("")}</div>`;
  }
  return `
    <div class="board-legend">
      <span><b>🎫 가져가기</b>와 <b>📖 공용 카드·남이 공개한 카드 열람</b>은 각각 토큰 1개가 듭니다 — 라운드당 최대 2번까지만(다 안 써도 무방)</span>
      <span>확보(가져가기)한 카드는 그 뒤로 나만 영구 무료로 다시 볼 수 있음 — 한 카드는 한 명만 가져갈 수 있음</span>
      <span>확보한 카드는 언제든 <b>🗣 공개하기</b>로 전원에게 알릴 수 있음(공개해도 남이 보려면 그 사람 토큰이 듦)</span>

    ${cards.map(card=>{
      if(card.kind==="view"){
        const isOpen = paidOpenSet.has(card.id);
        return `<div class="flipcard ${isOpen?'flipped':''}" data-idx="${card.id}" data-paid="1"><div class="flipcard-inner">
          <div class="face front">
            <div class="seal-icon">📖</div>
            <div class="exhibit-no">증거 ${card.exhibit}</div>
            <div class="owner-tag">${card.ownerName} · 공용 열람</div>
            <div class="tap-hint">🎫 탭하여 열람(1개)</div>

            <div class="doc-body">${card.body}</div>
            ${card.note?`<div class="doc-note">${card.note}</div>`:""}

      }

      const isRevealed = revealedSet.has(card.id);
      if(!claim){
        return `<div class="ownable" data-card="${card.id}">
          <div class="seal-icon">⚖</div>
          <div class="exhibit-no">증거 ${card.exhibit}</div>
          <div class="owner-tag">${card.ownerName}</div>
          <button class="btn primary claim-btn" data-claim="${card.id}">🔒 가져가기(🎫1개)</button>
        </div>`;
      }
      if(claim.by !== myRole && !isRevealed){
        const claimant = CHARACTERS.find(c=>c.id===claim.by);
        return `<div class="locked claimed"><div class="lock-icon">🔒</div><div>${claimant?claimant.name:"다른 참가자"}님이 확보함</div><div class="owner-tag">${card.ownerName}</div></div>`;
      }

      if(isMine){

        const canReveal = !isRevealed;

          <div class="doc-title">${card.title}</div>
          <div class="doc-body">${card.body}</div>
          ${card.note?`<div class="doc-note">${card.note}</div>`:""}
        </div>
      </div></div>`;
    }).join("")}
    </div>`;
}
function bindBoard(){
  app.querySelectorAll(".flipcard").forEach(el=>{
    const isPaid = el.dataset.paid === "1";
    el.addEventListener("click", async ()=>{
      const card = ALL_CARDS.find(c=>c.id===el.dataset.idx);
      if(!card) return;
      if(!isPaid){
        if(!myOpened.has(card.id)){
          // 처음 여는 카드 — "이미 본 카드" 표시를 남겨 다음에도 펼쳐진 채로 보이게 함
          myOpened.add(card.id); saveMyOpened(); render(); return;
        }
        el.classList.toggle("flipped");
        return;
      }
      // 유료 카드(공용 열람·타인 공개) — 접는 건 무료, 다시 펼치려면 토큰을 또 낸다
      if(paidOpenSet.has(card.id)){ paidOpenSet.delete(card.id); render(); return; }
      if(!EVIDENCE_PHASES.includes(sharedState.phase)){ showToast("🎫 증거 공개 라운드가 끝나 더 이상 토큰을 쓸 수 없습니다"); return; }
      if(remainingTokens() <= 0){ showToast("🎫 이번 라운드 토큰을 모두 사용했습니다"); return; }
      const ok = await store.spendToken(sharedState.phase, myRole);
      if(!ok){ showToast("🎫 이번 라운드 토큰을 모두 사용했습니다"); return; }
      paidOpenSet.add(card.id);
      render();
    });
  });
  app.querySelectorAll(".claim-btn").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      if(!EVIDENCE_PHASES.includes(sharedState.phase)){ showToast("🎫 증거 공개 라운드가 끝나 더 이상 가져갈 수 없습니다"); return; }
      if(remainingTokens() <= 0){ showToast("🎫 이번 라운드 토큰을 모두 사용했습니다"); return; }
      btn.disabled = true; btn.textContent = "확인 중...";
      const ok = await store.claimCard(btn.dataset.claim, myRole, sharedState.phase);
      if(!ok) showToast("이미 다른 사람이 가져갔거나 토큰이 부족합니다");
      render();
    });
  });
  app.querySelectorAll(".reveal-btn").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      btn.disabled = true; btn.textContent = "공개 중...";
      await store.revealCard(btn.dataset.reveal, myRole);
      render();
    });
  });
}

function votesDoneCount(){
  const keys = VOTE_AXES.map(a=>a.key);
  let n=0; votes.forEach(v=>{ if(v && keys.every(k=>v[k]!==undefined)) n++; }); return n;
}

  const v = votes.get(myRole);
  return !!(v && VOTE_AXES.every(a=>v[a.key]!==undefined));
}

        </div>
      </div>`).join("")}
    <div class="vote-progress">두 쟁점 모두 투표 완료: ${votesDoneCount()} / ${players.size}명${npcSet.size?` (NPC ${npcSet.size}명 제외)`:""}</div>
  `;
}
function bindVote(){
  app.querySelectorAll(".vote-opt").forEach(b=>{
    b.addEventListener("click", async ()=>{
      const cur = votes.get(myRole) || {};
      const next = {...cur, [b.dataset.axis]: b.dataset.v};
      votes.set(myRole, next);
      await store.castVote(myRole, next);
      if(votesDoneCount() >= players.size) advancePhase();
      else render();
    });
  });
}

function renderResult(){
  const tally = {};
  VOTE_AXES.forEach(axis=>{ tally[axis.key] = {reject:0, recognize:0}; });
  votes.forEach(v=>{
    VOTE_AXES.forEach(axis=>{ if(v && tally[axis.key][v[axis.key]]!==undefined) tally[axis.key][v[axis.key]]++; });
  });
  // 과반 규칙 — 동수일 땐 기각(reject)으로 처리
  const majority = axisKey => tally[axisKey].recognize > tally[axisKey].reject ? "recognize" : "reject";
  const axisResult = {}; VOTE_AXES.forEach(axis=>{ axisResult[axis.key] = majority(axis.key); });
  const endingKey = VOTE_AXES.map(axis=>axisResult[axis.key]).join("|");
  const ending = ENDINGS[endingKey];
  const ranked = [...CHARACTERS].sort((a,b)=>b.scores[endingKey]-a.scores[endingKey]);
  const topScore = ranked[0].scores[endingKey];
  const epilogueHtml = `
    <div class="epilogue-box">
      <div class="label">🏆 개인 점수판 — 이번 결말에서 나는 몇 점?</div>
      <p style="color:var(--text-dim);font-size:12.5px;margin-bottom:12px;">쟁점의 결론이 어느 쪽으로 나느냐에 따라, 각자에게 유리한 정도가 다릅니다. 같은 진영이라도 점수는 다를 수 있습니다.</p>
      ${ranked.map(c=>{
        const score = c.scores[endingKey];
        const isTop = score===topScore;
        const cardId = c.id+"-4";
        const wasRevealed = revealedSet.has(cardId);
        return `<div class="epilogue-row">
          <span class="ep-name">${isTop?"👑 ":""}${c.name}</span><span class="ep-tag">${c.side} · ${c.seat}${npcSet.has(c.id)?" · 🤖 NPC":""}</span><span class="ep-score ${score<0?'neg':'pos'}">${score>0?'+':''}${score}점</span><span class="ep-tag">${wasRevealed?"🗣 비밀 공개됨":"🔒 비밀 지켜짐"}</span>
          <div>${wasRevealed ? c.epilogue.revealed : c.epilogue.hidden}</div>
        </div>`;
      }).join("")}
    </div>`;
  return `
    ${VOTE_AXES.map(axis=>{
      const total = Math.max(1, tally[axis.key].reject + tally[axis.key].recognize);
      return `<div class="tally">
        <div class="axis-h"><span class="axis-label">${axis.label}</span> ${axis.title}</div>
        ${axis.options.map(o=>{
          const c = tally[axis.key][o.v]||0; const pct = Math.round(c/total*100);
          return `<div class="tally-row ${o.v===axisResult[axis.key]?'match':''}">
            <span>${o.t}</span><span class="mono">${c}표</span>
            <div class="tally-bar-track"><div class="tally-bar-fill" style="width:${pct}%"></div></div>
          </div>`;
        }).join("")}
      </div>`;
    }).join("")}
    <div class="verdict-box">
      <span class="stamp">${ending.stamp}</span>
      <h2>${ending.headline}</h2>
      <p style="white-space:pre-wrap;">${ending.body}</p>
    </div>
    <div class="lesson"><div class="label">LESSON</div>${ending.lesson}</div>
    <div class="matrix" style="margin-top:16px;">
      <p style="color:var(--text-dim);font-size:13px;margin-bottom:4px;">🔎 쟁점별 해설 — 토론 중엔 숨겨져 있던 진실입니다.</p>
      ${ISSUE_MATRIX.map(m=>`
        <div class="matrix-card">
          <div class="topic">${m.topic}</div>
          <div class="matrix-row truth"><span class="tag">숨겨진 진실</span><span>${m.truth}</span></div>
        </div>`).join("")}
    </div>
    ${epilogueHtml}
  `;
}

/* ============================================================
   4. 부팅 — Firebase 초기화 후 스토어 연결
   ============================================================ */
function updateConnBanner(){
  const el = document.getElementById("connBanner");
  if(!el) return;
  if(!dbHandle){
    el.className = "conn-banner show local";
    el.textContent = "⚠️ 실시간 동기화 연결 실패 — 이 기기는 다른 참가자와 공유되지 않는 단독 모드로 실행 중입니다. 인터넷 연결을 확인하고 새로고침해 주세요.";
  } else if(myRoom && !stateLoaded){
    el.className = "conn-banner show slow";
    el.textContent = "🔴 연결 확인 중... 계속 이 상태면 새로고침해 주세요.";
  } else {
    el.className = "conn-banner";
    el.textContent = "";
  }
}
async function boot(){
  try{
    firebase.initializeApp(firebaseConfig);
    dbHandle = firebase.firestore();
  }catch(e){ dbHandle = null; }
  updateConnBanner();
  if(myRoom) connectStore(); else render(); // 기존에 입장했던 방 코드가 있으면 바로 재연결

  setInterval(()=>{
    if(!store || sharedState.phase==="result") return;
    if(Date.now() >= phaseEndsAtMs()){ advancePhase(); return; }
    const remain = phaseEndsAtMs() - Date.now();
    const t = document.getElementById("timerEl"); // 전체 재렌더 없이 초시계만 갱신(클릭 타이밍 충돌 방지)
    if(t) t.textContent = fmtClock(remain);
  }, 1000);
}
boot();
</script>
