<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ER 미스터리 — 진행 방법</title>
<style>
@font-face{font-family:"Pretendard";src:url("../pretendard.woff2") format("woff2");font-weight:100 900;font-display:swap;}
:root{
  --ink:#f1e7cd;--ink-2:#e4d3a3;--ink-3:#b3945a;--ink-4:#cfb87e;--paper:#f8f1dc;--paper-shadow:#d6bf8d;
  --seal:#a1402a;--seal-bright:#bf5539;--gold:#8a6a2b;--text:#2b2314;--text-dim:#79693f;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#1b160c;overflow:hidden;font-family:"Pretendard",system-ui,sans-serif;color:var(--text);}
/* 1920×1080 고정 캔버스를 창 크기에 맞춰 축소·확대(남는 부분은 레터박스) */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--ink);}
.slide{position:absolute;inset:0;padding:80px 110px 120px;display:none;}
.slide.on{display:block;}
.slide h2{margin:0 0 36px;font-size:64px;font-weight:900;letter-spacing:-.01em;}
.slide .kicker{font-size:26px;font-weight:800;color:var(--seal);letter-spacing:.06em;margin-bottom:10px;}
#bar{position:absolute;left:0;right:0;bottom:0;height:72px;display:flex;align-items:center;gap:24px;padding:0 110px;
  border-top:2px solid var(--ink-3);background:var(--ink-2);font-size:22px;color:var(--text-dim);}
#bar a{color:var(--text-dim);}
#counter{margin-left:auto;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;}
#fsBtn{border:2px solid var(--text);background:var(--paper);border-radius:6px;padding:6px 16px;font:inherit;font-weight:700;color:var(--text);cursor:pointer;}
</style>
</head>
<body>
<div id="stage">
  <section class="slide" data-title="표지"><h2>표지</h2></section>
  <section class="slide" data-title="게임 한눈에"><h2>게임 한눈에</h2></section>
  <section class="slide" data-title="전체 흐름"><h2>전체 흐름</h2></section>
  <section class="slide" data-title="입장 화면"><h2>입장 화면</h2></section>
  <section class="slide" data-title="배역 선택"><h2>배역 선택</h2></section>
  <section class="slide" data-title="상단바"><h2>상단바</h2></section>
  <section class="slide" data-title="내 신원"><h2>내 신원</h2></section>
  <section class="slide" data-title="사건 개요"><h2>사건 개요</h2></section>
  <section class="slide" data-title="증거대 ① 가져가기"><h2>증거대 ① 가져가기</h2></section>
  <section class="slide" data-title="증거대 ② 공개하기"><h2>증거대 ② 공개하기</h2></section>
  <section class="slide" data-title="다음 단계로"><h2>다음 단계로</h2></section>
  <section class="slide" data-title="교차검증 토론"><h2>교차검증 토론</h2></section>
  <section class="slide" data-title="최종 투표"><h2>최종 투표</h2></section>
  <section class="slide" data-title="결과 화면"><h2>결과 화면</h2></section>
  <section class="slide" data-title="시작 전 체크"><h2>시작 전 체크</h2></section>
  <div id="bar">
    <a href="../">← 사건 목록으로</a>
    <span>← → 키·클리커로 넘기기</span>
    <button id="fsBtn" type="button">⛶ 전체화면</button>
    <span id="counter"></span>
  </div>
</div>
<script>
const stage = document.getElementById("stage");
const slides = [...document.querySelectorAll(".slide")];
let cur = 0;
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
function go(n){
  cur = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((el,i)=>el.classList.toggle("on", i===cur));
  document.getElementById("counter").textContent = `${cur+1} / ${slides.length}`;
  history.replaceState(null, "", "#"+(cur+1));
}
addEventListener("keydown", e=>{
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); go(cur+1); }
  else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==="Home") go(0);
  else if(e.key==="End") go(slides.length-1);
});
stage.addEventListener("click", e=>{
  if(e.target.closest("#bar")) return;
  go(e.clientX > innerWidth/2 ? cur+1 : cur-1);
});
document.getElementById("fsBtn").addEventListener("click", ()=>{
  document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
addEventListener("resize", fit);
fit();
go((parseInt(location.hash.slice(1),10) || 1) - 1);
</script>
</body>
</html>
